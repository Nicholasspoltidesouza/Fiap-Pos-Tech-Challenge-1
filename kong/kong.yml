_format_version: "3.0"

consumers:
  - username: oficina-client
    jwt_secrets:
      - key: oficina-auth
        algorithm: HS512
        secret: oficina-local-hs512-secret-not-for-production-000000000000000001

services:
  - name: auth-lambda
    url: http://auth-lambda:8080
    routes:
      - name: auth-cpf
        paths: ["/auth/cpf"]
        methods: ["POST"]
        strip_path: false
  - name: notify-lambda
    url: http://notify-lambda:8080
    routes:
      - name: notify
        paths: ["/notify"]
        methods: ["POST"]
        strip_path: false
  - name: oficina-api-public
    url: http://app:8080
    routes:
      - name: api-auth
        paths: ["/api/auth"]
        strip_path: false
      - name: swagger
        paths: ["/swagger-ui", "/swagger-ui.html", "/v3/api-docs"]
        strip_path: false
      - name: actuator
        paths: ["/actuator/health", "/actuator/prometheus"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:8000"
            - "http://localhost:8080"
            - "http://127.0.0.1:8000"
            - "http://127.0.0.1:8080"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Correlation-Id
          exposed_headers:
            - Authorization
            - X-Correlation-Id
          credentials: true
          max_age: 3600
  - name: oficina-api-protected
    url: http://app:8080
    routes:
      - name: api-protected
        paths: ["/api"]
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:8000"
            - "http://localhost:8080"
            - "http://127.0.0.1:8000"
            - "http://127.0.0.1:8080"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Correlation-Id
          exposed_headers:
            - Authorization
            - X-Correlation-Id
          credentials: true
          max_age: 3600
      - name: jwt
        config:
          key_claim_name: iss
          claims_to_verify: ["exp"]
      - name: correlation-id
        config:
          header_name: X-Correlation-Id
          generator: uuid
          echo_downstream: true
      - name: prometheus
