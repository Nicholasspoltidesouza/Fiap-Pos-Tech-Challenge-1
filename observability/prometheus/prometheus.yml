global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: oficina-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8001"]
